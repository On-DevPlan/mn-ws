# Release —— 打附注 tag 即发版到 npm（主包 + 四个平台子包）。
#
# ## 分发模型（0.7.2 起，esbuild / rollup 同款）
#
# 原生二进制按平台不同，而一个包名一个版本在 npm 上只能有一份 tarball ——
# 所以二进制住进**平台子包**（mn-ws-win32-x64 / mn-ws-darwin-x64 /
# mn-ws-darwin-arm64 / mn-ws-linux-x64，各在**自己的平台**上编译、各带
# os/cpu 字段），主包 `mn-ws`（bin = JS 启动器 + React 产物）通过
# optionalDependencies 引用它们：用户装主包时 npm 只装匹配平台的那一个。
#
# 发布顺序不能反：先发 4 个子包（平台矩阵并行），全部成功后发主包 ——
# 主包的依赖版本指向刚发的子包版本，先发主包会装到不存在的子包。
#
# 所有包**同版本同发**（子包版本由 scripts/sync-optional-deps.mjs 对齐，
# 测试 job 里有防呆校验）。
#
# 为什么 tag 必须与 package.json 版本一致：
#   npm 上同一个版本号**永远只能发一次**（重发报 E403 "cannot publish over"）。
#   tag 与版本对不上就会跳号。宁可在流水线里当场失败。
#
# Secrets:
#   NPM_TOKEN —— npm 发布令牌（Automation 类型，永久不过期、绕过 2FA）
#
# 手动发版：Actions 里选本 workflow → Run workflow（用 package.json 里已有的版本号）

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # provenance 签名要用 OIDC 换短期身份凭证 —— 少了这行 --provenance 会失败
  id-token: write

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tag 检测要完整历史

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 附注 tag 与版本号必须一致 —— 见文件头说明
      - name: 校验 tag 与版本一致
        run: |
          set -euo pipefail
          CLIENT_VER=$(node -p "require('./client/package.json').version")
          SERVER_VER=$(node -p "require('./server/package.json').version")
          echo "mn-ws $CLIENT_VER · mn-ws-server（不发 npm）$SERVER_VER"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "v$CLIENT_VER" ]; then
              echo "::error::tag ($TAG) 与版本 (v$CLIENT_VER) 不一致 —— 不发布，避免 npm 上出现跳号版本"
              exit 1
            fi
          else
            echo "手动触发：使用 v$CLIENT_VER"
          fi

      # 防呆：主包与 4 个平台子包必须同版本。跑了 sync 脚本后 git 必须是干净的
      # —— 有 diff 说明有人改了主包版本忘了同步子包。
      - name: 校验平台子包版本对齐
        run: |
          set -euo pipefail
          node scripts/sync-optional-deps.mjs
          git diff --exit-code client/platform \
            || { echo "::error::平台子包版本未与主包对齐 —— 本地跑 scripts/sync-optional-deps.mjs 后再提交"; exit 1; }

      - name: Build packages
        run: pnpm -r --workspace-concurrency=1 build

      - name: 编译 Rust 产物（测试用）
        run: |
          set -euo pipefail
          cd rust
          cargo build --release
          cd ..

      - name: Test
        run: |
          pnpm --filter mn-ws-server test
          pnpm --filter mn-ws test:unit
          # Rust 侧的测试（协议层 + server 半 + e2e）
          cd rust && cargo test --release && cd ..
          # 交叉兼容：TS ↔ Rust 两个方向都要通
          pnpm --filter mn-ws test:cross
          # Rust 面板实测：伺服 React 产物 + 全部 API 端点
          pnpm --filter mn-ws test:panel

  # ── 平台矩阵：每平台各自编译二进制、生成并发布子包 ─────────────────
  platform:
    name: 发布 ${{ matrix.key }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  key: linux-x64 }
          - { os: windows-latest, key: win32-x64 }
          - { os: macos-13,       key: darwin-x64 }   # Intel
          - { os: macos-14,       key: darwin-arm64 } # Apple Silicon
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # setup-node 只为 ~/.npmrc 的发布认证（编译本身用不到 Node）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 编译 Rust 产物
        run: cargo build --release
        working-directory: rust

      - name: 生成平台子包
        run: node scripts/make-platform-pkg.mjs

      - name: 发布子包
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          KEY="${{ matrix.key }}"
          PKG="mn-ws-${KEY}"
          VER=$(node -p "require('./client/platform/${KEY}/package.json').version")
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "${PKG}@${VER} 已在 npm 上，跳过"
            exit 0
          fi
          npm publish "client/platform/${KEY}" --provenance --access public

  # ── 主包：全部子包就位后发布（bin = 启动器 + React 产物）──────────
  publish-main:
    name: 发布 mn-ws
    needs: platform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 主包要带面板产物（React 构建，平台无关，只此一份）
      - name: Build client（React 产物）
        run: pnpm --filter mn-ws build

      - name: 装 web 产物进主包
        run: node scripts/install-rust-bin.mjs web

      # ── 发主包 ─────────────────────────────────────────────────────
      #
      # pnpm pack 会把 optionalDependencies 里的 workspace:* 重写成具体版本
      # （npm publish 不认识 workspace 协议），npm publish <tarball> 保留
      # provenance 签名（pnpm publish 没有这个 flag）。
      - name: 发布 mn-ws
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd client
          VER=$(node -p "require('./package.json').version")
          if npm view "mn-ws@$VER" version >/dev/null 2>&1; then
            echo "mn-ws@$VER 已在 npm 上，跳过"
            exit 0
          fi
          pnpm pack --pack-destination .pack
          npm publish ".pack/mn-ws-$VER.tgz" --provenance --access public

      - name: 建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 先查再建：重复触发不会撞。Release 只留 tag 与 notes ——
          # 二进制不挂资产（分发走 npm 平台子包 + Docker 镜像）。
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "$TAG" --generate-notes
          echo "release $TAG 已发布"
