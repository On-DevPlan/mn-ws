# Release —— 打附注 tag 即发版到 npm。
#
# 本仓库发**两个**包（monorepo）：
#   mn-ws-server  —— server 半（公网机上的中继）
#   mn-ws         —— client 半（本机的 CLI + Web 面板）
#
# **发布顺序不能反**：client 半的依赖里有 mn-ws-server，
# 先发 client 会装到一个还不存在的版本。
#
# 为什么 tag 必须与 package.json 版本一致：
#   npm 上同一个版本号**永远只能发一次**（重发报 E403 "cannot publish over"）。
#   tag 与版本对不上就会跳号。宁可在流水线里当场失败。
#
# Secrets:
#   NPM_TOKEN —— npm 发布令牌（Automation 类型，永久不过期、绕过 2FA）
#
# 手动发版：Actions 里选本 workflow → Run workflow（用 package.json 里已有的版本号）

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # provenance 签名要用 OIDC 换短期身份凭证 —— 少了这行 --provenance 会失败
  id-token: write

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tag 检测要完整历史

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 附注 tag 与版本号必须一致 —— 见文件头说明
      - name: 校验 tag 与两个包的版本一致
        run: |
          set -euo pipefail
          SERVER_VER=$(node -p "require('./server/package.json').version")
          CLIENT_VER=$(node -p "require('./client/package.json').version")
          echo "mn-ws-server $SERVER_VER · mn-ws $CLIENT_VER"
          if [ "$SERVER_VER" != "$CLIENT_VER" ]; then
            echo "::error::两个包的版本不一致（server $SERVER_VER / client $CLIENT_VER）—— 一起发版就该同号"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "v$SERVER_VER" ]; then
              echo "::error::tag ($TAG) 与版本 (v$SERVER_VER) 不一致 —— 不发布，避免 npm 上出现跳号版本"
              exit 1
            fi
          else
            echo "手动触发：使用 v$SERVER_VER"
          fi

      - name: Build packages
        run: pnpm -r --workspace-concurrency=1 build

      # ── Rust 产物 ───────────────────────────────────────────────────
      #
      # npm 包里带的是**原生二进制**（运行时零 Node 依赖）。
      # 这里编当前平台的产物，装进两个包，并把 `bin` 字段改写成
      # 当前平台的真实文件名（npm 不做扩展名补全 ——
      # 指向 `./bin/mn-ws` 而文件是 `./bin/mn-ws.exe` 时，npm 不生成 shim）。
      #
      # ⚠️ 发布的包只含**当前平台**的产物 —— 用户装到的是他所在平台的版本。
      #    多平台的完整矩阵见 `build-rust.yml`。
      - name: 编译 Rust 产物
        run: |
          set -euo pipefail
          cd rust
          cargo build --release
          cd ..

      - name: 装 Rust 产物进 npm 包
        run: node scripts/install-rust-bin.mjs all

      - name: Test
        run: |
          pnpm --filter mn-ws-server test
          pnpm --filter mn-ws test:unit
          # Rust 侧的测试（协议层 + server 半 + e2e）
          cd rust && cargo test --release && cd ..
          # 交叉兼容：TS ↔ Rust 两个方向都要通
          pnpm --filter mn-ws test:cross
          # Rust 面板实测：伺服 React 产物 + 全部 API 端点
          pnpm --filter mn-ws test:panel

      # ── 发 server 半（先）────────────────────────────────────────────
      #
      # ⚠️ 为什么是 `pnpm pack` + `npm publish <tarball>` 而不是 `npm publish`：
      #   client 包的依赖里有 `workspace:*`（workspace 协议）。**npm publish 不认识
      #   这个协议** —— 原样发出去的话，安装方直接报
      #   `Unsupported URL Type "workspace:"`，包等于废掉。
      #   pnpm pack 会把它重写成具体版本（workspace:* → 0.2.0），
      #   而 npm publish <tarball> 保留 provenance 签名（pnpm publish 没有这个 flag）。
      - name: 发布 mn-ws-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd server
          VER=$(node -p "require('./package.json').version")
          if npm view "mn-ws-server@$VER" version >/dev/null 2>&1; then
            echo "mn-ws-server@$VER 已在 npm 上，跳过"
            exit 0
          fi
          pnpm pack --pack-destination .pack
          npm publish ".pack/mn-ws-server-$VER.tgz" --provenance --access public

      # ── 等 server 半真的可解析，再发 client 半 ──────────────────────
      #
      # ⚠️ npm 是**分阶段发布**的：publish 只是把版本提交上去，
      #    真正可安装还要等平台提升（实测 1-3 分钟，有时更久）。
      #    client 半的依赖是 mn-ws-server@<同版本> —— server 半没被提升之前，
      #    装 mn-ws 直接报 "No matching version found for mn-ws-server@x.y.z"。
      #    所以必须**等它可解析**，而不是「publish 完就接着发下一个」。
      - name: 等 mn-ws-server 可解析
        run: |
          set -euo pipefail
          cd server
          VER=$(node -p "require('./package.json').version")
          for i in $(seq 1 90); do
            if npm view "mn-ws-server@$VER" version >/dev/null 2>&1; then
              echo "mn-ws-server@$VER 已可解析（第 $i 次探测）"
              exit 0
            fi
            echo "  等待 mn-ws-server@$VER 被提升…（第 $i 次，每次 20s）"
            sleep 20
          done
          echo "::error::mn-ws-server@$VER 30 分钟内没被提升 —— 停在这里，别发 client（装了也装不上）"
          exit 1

      # ── 再发 client 半（依赖刚被提升的 server 半）──────────────────────
      - name: 发布 mn-ws
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd client
          VER=$(node -p "require('./package.json').version")
          if npm view "mn-ws@$VER" version >/dev/null 2>&1; then
            echo "mn-ws@$VER 已在 npm 上，跳过"
            exit 0
          fi
          pnpm pack --pack-destination .pack
          npm publish ".pack/mn-ws-$VER.tgz" --provenance --access public

      - name: 建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TAG" \
            --generate-notes \
            || gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --generate-notes
          echo "release $TAG 已发布"
