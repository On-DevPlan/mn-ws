# Release —— 打附注 tag 即发版到 npm。
#
# 本仓库发**两个**包（monorepo）：
#   mn-ws-server  —— server 半（公网机上的中继）
#   mn-ws         —— client 半（本机的 CLI + Web 面板）
#
# **发布顺序不能反**：client 半的依赖里有 mn-ws-server，
# 先发 client 会装到一个还不存在的版本。
#
# 为什么 tag 必须与 package.json 版本一致：
#   npm 上同一个版本号**永远只能发一次**（重发报 E403 "cannot publish over"）。
#   tag 与版本对不上就会跳号。宁可在流水线里当场失败。
#
# Secrets:
#   NPM_TOKEN —— npm 发布令牌（Automation 类型，永久不过期、绕过 2FA）
#
# 手动发版：Actions 里选本 workflow → Run workflow（用 package.json 里已有的版本号）

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # provenance 签名要用 OIDC 换短期身份凭证 —— 少了这行 --provenance 会失败
  id-token: write

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tag 检测要完整历史

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 附注 tag 与版本号必须一致 —— 见文件头说明
      - name: 校验 tag 与两个包的版本一致
        run: |
          set -euo pipefail
          SERVER_VER=$(node -p "require('./server/package.json').version")
          CLIENT_VER=$(node -p "require('./client/package.json').version")
          echo "mn-ws-server $SERVER_VER · mn-ws $CLIENT_VER"
          if [ "$SERVER_VER" != "$CLIENT_VER" ]; then
            echo "::error::两个包的版本不一致（server $SERVER_VER / client $CLIENT_VER）—— 一起发版就该同号"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "v$SERVER_VER" ]; then
              echo "::error::tag ($TAG) 与版本 (v$SERVER_VER) 不一致 —— 不发布，避免 npm 上出现跳号版本"
              exit 1
            fi
          else
            echo "手动触发：使用 v$SERVER_VER"
          fi

      - name: Build packages
        run: pnpm -r --workspace-concurrency=1 build

      - name: Test
        run: |
          pnpm --filter mn-ws-server test
          pnpm --filter mn-ws test:unit

      # ── 发 server 半（先）────────────────────────────────────────────
      - name: 发布 mn-ws-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd server
          if npm view "mn-ws-server@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "mn-ws-server@$(node -p "require('./package.json').version") 已在 npm 上，跳过"
            exit 0
          fi
          npm publish --provenance --access public

      # ── 再发 client 半（依赖刚发出去的 server 半）──────────────────────
      - name: 发布 mn-ws
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd client
          if npm view "mn-ws@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "mn-ws@$(node -p "require('./package.json').version") 已在 npm 上，跳过"
            exit 0
          fi
          npm publish --provenance --access public

      - name: 建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TAG" \
            --generate-notes \
            || gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --generate-notes
          echo "release $TAG 已发布"
