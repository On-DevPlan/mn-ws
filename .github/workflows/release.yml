# Release —— 打附注 tag 即发版到 npm。
#
# 本仓库发**两个**包（monorepo）：
#   mn-ws-server  —— server 半（公网机上的中继）
#   mn-ws         —— client 半（本机的 CLI + Web 面板）
#
# **发布顺序不能反**：client 半的依赖里有 mn-ws-server，
# 先发 client 会装到一个还不存在的版本。
#
# 为什么 tag 必须与 package.json 版本一致：
#   npm 上同一个版本号**永远只能发一次**（重发报 E403 "cannot publish over"）。
#   tag 与版本对不上就会跳号。宁可在流水线里当场失败。
#
# Secrets:
#   NPM_TOKEN —— npm 发布令牌（Automation 类型，永久不过期、绕过 2FA）
#
# 手动发版：Actions 里选本 workflow → Run workflow（用 package.json 里已有的版本号）

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # provenance 签名要用 OIDC 换短期身份凭证 —— 少了这行 --provenance 会失败
  id-token: write

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tag 检测要完整历史

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 附注 tag 与版本号必须一致 —— 见文件头说明
      #
      # ⚠️ 0.7.0 起只校验 **client 包**：server 半不再发布到 npm
      #    （它的分发渠道是 Docker 镜像），所以两个包不必同号了。
      - name: 校验 tag 与版本一致
        run: |
          set -euo pipefail
          CLIENT_VER=$(node -p "require('./client/package.json').version")
          SERVER_VER=$(node -p "require('./server/package.json').version")
          echo "mn-ws $CLIENT_VER · mn-ws-server（不发 npm）$SERVER_VER"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "v$CLIENT_VER" ]; then
              echo "::error::tag ($TAG) 与版本 (v$CLIENT_VER) 不一致 —— 不发布，避免 npm 上出现跳号版本"
              exit 1
            fi
          else
            echo "手动触发：使用 v$CLIENT_VER"
          fi

      - name: Build packages
        run: pnpm -r --workspace-concurrency=1 build

      # ── Rust 产物 ───────────────────────────────────────────────────
      #
      # npm 包里带的是**原生二进制**（运行时零 Node 依赖）。
      # 这里编当前平台的产物，装进两个包，并把 `bin` 字段改写成
      # 当前平台的真实文件名（npm 不做扩展名补全 ——
      # 指向 `./bin/mn-ws` 而文件是 `./bin/mn-ws.exe` 时，npm 不生成 shim）。
      #
      # ⚠️ 发布的包只含**当前平台**的产物 —— 用户装到的是他所在平台的版本。
      #    多平台的完整矩阵见 `build-rust.yml`。
      - name: 编译 Rust 产物
        run: |
          set -euo pipefail
          cd rust
          cargo build --release
          cd ..

      - name: 装 Rust 产物进 npm 包
        run: node scripts/install-rust-bin.mjs all

      - name: Test
        run: |
          pnpm --filter mn-ws-server test
          pnpm --filter mn-ws test:unit
          # Rust 侧的测试（协议层 + server 半 + e2e）
          cd rust && cargo test --release && cd ..
          # 交叉兼容：TS ↔ Rust 两个方向都要通
          pnpm --filter mn-ws test:cross
          # Rust 面板实测：伺服 React 产物 + 全部 API 端点
          pnpm --filter mn-ws test:panel

      # ── 发 client 半 ─────────────────────────────────────────────────
      #
      # ⚠️ 0.7.0 起**只发 client 半**：
      #   · server 半不再发 npm —— 它的分发渠道是 **Docker 镜像**
      #     （公网机上的服务，一个 npm 包对它没有意义）。
      #   · client 半不再依赖 mn-ws-server —— 运行时零依赖，装完就能用。
      #
      # 所以这里没有「先发 server、等它被 npm 提升、再发 client」那套编排了。
      # （0.6.x 需要那套，是因为 client 依赖 mn-ws-server@同版本。）
      #
      # 为什么是 `pnpm pack` + `npm publish <tarball>` 而不是 `npm publish`：
      #   pnpm pack 会把 `workspace:*` 重写成具体版本（npm publish 不认识
      #   这个协议 —— 原样发出去的话安装方直接报 `Unsupported URL Type "workspace:"`），
      #   而 npm publish <tarball> 保留 provenance 签名（pnpm publish 没有这个 flag）。
      - name: 发布 mn-ws
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd client
          VER=$(node -p "require('./package.json').version")
          if npm view "mn-ws@$VER" version >/dev/null 2>&1; then
            echo "mn-ws@$VER 已在 npm 上，跳过"
            exit 0
          fi
          pnpm pack --pack-destination .pack
          npm publish ".pack/mn-ws-$VER.tgz" --provenance --access public

      - name: 建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TAG" \
            --generate-notes \
            || gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --generate-notes
          echo "release $TAG 已发布"
