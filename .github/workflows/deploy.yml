# Deploy —— tarball 派：runner build → docker save → gzip → scp → 服务器 docker load。
#
# 为什么不用 GHCR：服务器 pull ghcr.io 实测很慢（跨境 + GHCR 同步怪现象），
# 一次部署的等待时间比传输本身还长。改成**镜像直接传**：
#   runner 构建 → save 成 tar → gzip（node:22-alpine 基础镜像压得动）
#   → scp 一个 ~40MB 的包到服务器 → docker load → 重启容器
# 代价是每次部署都要传一遍镜像（~40MB），换来的是**部署时间可控**。
#
# 服务器档案 / secrets 配置 / 运维命令：见 docs/DEPLOY.md
#
# Secrets:
#   HOST / USERNAME / PORT / SSH_KEY —— 部署机 SSH
#   MN_WS_TOKEN —— 静态注册门禁
#   MN_WS_JWT_SECRET —— 统一登录的 JWT 签名密钥（配了就启用设备令牌）
#   MN_WS_AUTH_ENABLED —— 显式开/关统一登录（1/true/yes/on 与 0/false/no/off）
#   MN_WS_ISSUER / MN_WS_IDP_CLIENT_ID —— 认证中心参数

name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'lib/**'
      - 'client/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  # 不用 ghcr.io 前缀 —— 这个镜像只在这条流水线里流转，不入任何公共仓库
  IMAGE_NAME: mn-ws-server
  CONTAINER_NAME: mn_ws_server
  HOST_PORT: 7777
  TAR_NAME: mn-ws-server.tar.gz

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 构建 ──────────────────────────────────────────────────────────
      # load: true 把镜像导回 runner 的本地 docker（不推任何仓库）。
      # platforms 显式锁 amd64：runner 是 x86_64，服务器也是 x86_64，
      # 但 buildx 默认按 runner 平台推，显式写死免得哪天换了 arm runner 直接炸。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load into runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 打包 ──────────────────────────────────────────────────────────
      # 两个 tag 一起 save：:latest 给日常用，:${sha} 给回滚用。
      # gzip 压的是基础镜像层，node:22-alpine 这类底子压得动。
      - name: Save image to gzipped tarball
        run: |
          set -euo pipefail
          docker save "${{ env.IMAGE_NAME }}:latest" "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            | gzip -9 > "${{ env.TAR_NAME }}"
          ls -lh "${{ env.TAR_NAME }}"
          echo "tarball ready: $(du -h "${{ env.TAR_NAME }}" | cut -f1)"

      # secret 长度诊断：任一没配/配错第一时间在日志里看到，不用等部署失败再猜
      - name: Diagnose secrets (length only)
        if: always()
        env:
          HOST_LEN:       ${{ secrets.HOST }}
          USERNAME_LEN:   ${{ secrets.USERNAME }}
          SSH_KEY_LEN:    ${{ secrets.SSH_KEY }}
          PORT_LEN:       ${{ secrets.PORT }}
          MN_WS_TOKEN_LEN: ${{ secrets.MN_WS_TOKEN }}
          MN_WS_JWT_SECRET_LEN: ${{ secrets.MN_WS_JWT_SECRET }}
          MN_WS_AUTH_ENABLED_VAL: ${{ secrets.MN_WS_AUTH_ENABLED }}
          MN_WS_ISSUER_VAL: ${{ secrets.MN_WS_ISSUER }}
        run: |
          echo "HOST length: ${#HOST_LEN}"
          echo "USERNAME length: ${#USERNAME_LEN}"
          echo "SSH_KEY length: ${#SSH_KEY_LEN}"
          echo "PORT length: ${#PORT_LEN}"
          echo "MN_WS_TOKEN length: ${#MN_WS_TOKEN_LEN} (0=未配，客户端只能用设备令牌注册)"
          echo "MN_WS_JWT_SECRET length: ${#MN_WS_JWT_SECRET_LEN} (0=未配，签不出设备令牌)"
          echo "MN_WS_AUTH_ENABLED: '${MN_WS_AUTH_ENABLED_VAL:-<未配>}' (认 1/true/yes/on 与 0/false/no/off)"
          echo "MN_WS_ISSUER: '${MN_WS_ISSUER_VAL:-<未配>}'"

      # ── 传输 ──────────────────────────────────────────────────────────
      - name: Copy tarball to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: "${{ env.TAR_NAME }}"
          target: "~/app/"
          timeout: 10m
          rm: true

      # ── 部署 ──────────────────────────────────────────────────────────
      - name: Load image and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          MN_WS_TOKEN: ${{ secrets.MN_WS_TOKEN || '' }}
          MN_WS_JWT_SECRET: ${{ secrets.MN_WS_JWT_SECRET || '' }}
          MN_WS_AUTH_ENABLED: ${{ secrets.MN_WS_AUTH_ENABLED || '' }}
          MN_WS_ISSUER: ${{ secrets.MN_WS_ISSUER || '' }}
          MN_WS_IDP_CLIENT_ID: ${{ secrets.MN_WS_IDP_CLIENT_ID || '' }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          envs: MN_WS_TOKEN,MN_WS_JWT_SECRET,MN_WS_AUTH_ENABLED,MN_WS_ISSUER,MN_WS_IDP_CLIENT_ID
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e
            cd ~/app

            IMAGE="${{ env.IMAGE_NAME }}:latest"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            HOST_PORT="${{ env.HOST_PORT }}"
            TAR_NAME="${{ env.TAR_NAME }}"

            echo "Loading image from ${TAR_NAME}..."
            ls -lh "$TAR_NAME"
            gunzip -c "$TAR_NAME" | docker load
            rm -f "$TAR_NAME"          # 传完就删，别在磁盘上堆镜像包
            docker image inspect "$IMAGE" > /dev/null \
              || { echo "load 后找不到镜像 $IMAGE"; exit 1; }
            echo "image loaded: $IMAGE"

            # ── 部署前的意图判定 ──────────────────────────────────────────
            # 必须和代码里的 wantAuth 推导一致：
            #   显式开关优先，没表态就跟随「配没配 JWT secret」。
            # 断言用的是这个**意图值**，不是「我传了什么」。
            AUTH_RAW="${MN_WS_AUTH_ENABLED:-}"
            case "$(printf '%s' "$AUTH_RAW" | tr 'A-Z' 'a-z')" in
              1|true|yes|on) AUTH_WANT=true ;;
              0|false|no|off) AUTH_WANT=false ;;
              "")             AUTH_WANT=false ;;   # 没表态
              *) echo "MN_WS_AUTH_ENABLED 取值无法识别: $AUTH_RAW"; exit 1 ;;
            esac
            if [ -z "$AUTH_RAW" ] && [ -n "$MN_WS_JWT_SECRET" ]; then
              AUTH_WANT=true
            fi
            echo "verify auth: want=$AUTH_WANT"

            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm   "${CONTAINER_NAME}" 2>/dev/null || true

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --memory 256m \
              -p "${HOST_PORT}:7777" \
              -v mn_ws_data:/app/data \
              -e MN_WS_HOST=0.0.0.0 \
              -e MN_WS_PORT=7777 \
              -e MN_WS_HOME=/app \
              -e MN_WS_LOG_LEVEL=info \
              ${MN_WS_TOKEN:+-e MN_WS_TOKEN="$MN_WS_TOKEN"} \
              ${MN_WS_JWT_SECRET:+-e MN_WS_JWT_SECRET="$MN_WS_JWT_SECRET"} \
              ${MN_WS_AUTH_ENABLED:+-e MN_WS_AUTH_ENABLED="$MN_WS_AUTH_ENABLED"} \
              ${MN_WS_ISSUER:+-e MN_WS_ISSUER="$MN_WS_ISSUER"} \
              ${MN_WS_IDP_CLIENT_ID:+-e MN_WS_IDP_CLIENT_ID="$MN_WS_IDP_CLIENT_ID"} \
              "${IMAGE}"

            # ── 部署后必须验一次「配了的确实生效了」────────────────────────
            MAX=6; i=0; ok=false
            while [ $i -lt $MAX ]; do
              i=$((i + 1))
              echo "Health $i/$MAX..."
              if curl -f -s "http://localhost:${HOST_PORT}/health" > /dev/null; then
                ok=true; echo "Health passed!"; break
              fi
              sleep 10
            done

            if [ "$ok" = false ]; then
              echo "Health FAILED. Recent logs:"
              docker logs "${CONTAINER_NAME}" --tail 60
              exit 1
            fi

            # ── 运行态断言：进程自己报的 enabled 必须与部署意图一致 ────────
            CFG=$(curl -s -m 10 "http://localhost:${HOST_PORT}/auth/oidc/config")
            echo "GET /auth/oidc/config -> $CFG"
            AUTH_IS=$(printf '%s' "$CFG" | sed -n 's/.*"enabled":\([a-z]*\).*/\1/p')
            if [ "$AUTH_IS" != "$AUTH_WANT" ]; then
              echo "统一登录状态与部署意图不符：期望 enabled=$AUTH_WANT，实际 '${AUTH_IS:-无}'"
              echo "（这正是「配了 1 却被当成关闭」那类静默失效的形态，不要放行）"
              docker logs "${CONTAINER_NAME}" --tail 40
              exit 1
            fi
            if [ "$AUTH_WANT" = "true" ]; then
              if ! printf '%s' "$CFG" | grep -q '"idpAvailable":true'; then
                echo "统一登录已开启但拉不到认证中心发现文档（容器到 issuer 的网络不通）"
                echo "  issuer=$(printf '%s' "$CFG" | sed -n 's/.*"issuer":"\([^"]*\)".*/\1/p')"
                docker logs "${CONTAINER_NAME}" --tail 40
                exit 1
              fi
              echo "auth ok: enabled + idpAvailable"
            fi

            # 旧镜像层清一清，磁盘紧张（宿机 1.7Gi 内存 / 磁盘也满）
            docker image prune -f > /dev/null || true
            echo "Deployment successful!"
