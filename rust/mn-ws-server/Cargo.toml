[package]
name = "mn-ws-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "mn-ws server 半：公网侧的 HTTP ⇄ WebSocket 桥（Rust 实现，运行时零 Node 依赖）"
publish = false

[lib]
name = "mn_ws_server"
path = "src/lib.rs"

[[bin]]
name = "mn-ws-server"
path = "src/main.rs"

[dependencies]
# 共享协议层：帧格式 + app 路由规则。client 半也依赖它 —— 两半只有一份协议实现。
mn-ws-core = { path = "../mn-ws-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util", "net"] }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
